name: chain_reaction_city
description: "Chain Reaction City - one-tap 3D physics puzzle game. One tap. Total chaos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - logo.png
    - assets/models/
    - assets/levels/
    - assets/audio/

  fonts:
    - family: Toy
      fonts:
        - asset: assets/fonts/Toy-Regular.ttf
          weight: 400
        - asset: assets/fonts/Toy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Toy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Toy-Black.ttf
          weight: 900
